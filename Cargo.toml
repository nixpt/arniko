[workspace]
resolver = "2"
members = [
    # Arniko SDK
    "crates/arniko",
    # Networking
    "crates/exo-bliss-net",    # Arniko Crush capsule bindings
    "crates/arniko-crush",
]

[workspace.package]
version      = "0.3.0"
license      = "MIT OR Apache-2.0"
homepage     = "https://github.com/nixpt/arniko"
repository   = "https://github.com/nixpt/arniko"
categories   = ["gui"]
edition      = "2024"
rust-version = "1.89"

# ── workspace.dependencies ────────────────────────────────────────────────────
[workspace.dependencies]
# BLISS-HOME-2 (s506): the bliss/stylo_taffy/accesskit_xplat/anyrender_vello
# crates that used to live in-tree here (crates/bliss, crates/bliss-dom, ...)
# have moved to their own repo, nixpt/bliss-engine, and are published to
# crates.io at 0.3.0. Consumed the same way `mustang` already was below
# (registry dep, NOT a workspace member, NOT patched in-repo) — no more
# `[patch.crates-io]` bliss-* block.
bliss         = { version = "0.3", package = "arniko-bliss" }
bliss-dom     = { version = "0.3", default-features = false }
bliss-html    = { version = "0.3", default-features = false }
bliss-net     = { version = "0.3", default-features = false }
bliss-paint   = { version = "0.3", default-features = false }
bliss-shell   = { version = "0.3", default-features = false }
bliss-traits  = { version = "0.3", default-features = false }
stylo_taffy   = { version = "0.3", package = "bliss-stylo-taffy", default-features = false }
# debug_timer: bliss-engine found this identical to nicoburns' upstream
# crate and depends on it directly rather than republishing — do the same
# here (was already effectively true: the old dual path+version pin
# resolved to upstream 0.1.3 for any registry consumer anyway).
debug_timer   = { version = "0.1.3" }
# accesskit_xplat: bliss-engine's fork is genuinely modified (graceful
# UiKit/WinRT fallback, hardened Android JNI attach) and republished as
# `bliss-accesskit-xplat` — `package =` keeps the in-repo `accesskit_xplat`
# name working for any consumer that still uses it.
accesskit_xplat = { version = "0.3", package = "bliss-accesskit-xplat", default-features = false }
# anyrender_vello: bliss-engine's fork (SceneOverlay/set_scene_effects
# mustang hooks) is republished as `bliss-anyrender-vello`.
anyrender_vello = { version = "0.3", package = "bliss-anyrender-vello" }
# mustang lives in its own repo (nixpt/mustang), published as `arniko-mustang`
# (0.3.0 from tag v0.3.0 @ 1db503e; the old in-tree crates/mustang snapshot is gone).
# Consumed from crates.io here — unlike bliss-*, mustang is NOT a workspace
# member and NOT patched in-repo; this is intentional (see foreman-memory
# `arniko-mustang-bliss-surfer-architecture.md`).
#
# Do NOT add `arniko-mustang = { path = "../mustang" }` to `[patch.crates-io]`
# under normal use: a cross-workspace redirect breaks fresh `cargo check -p
# arniko` if `projects/mustang/` isn't cloned alongside arniko. Use a transient
# (uncommitted) `[patch.crates-io]` override only when iterating mustang+arniko
# in lock-step.
mustang       = { version = "0.3", package = "arniko-mustang" }
arniko        = { path = "crates/arniko",       version = "0.3.0" }
exo-bliss-net = { path = "crates/exo-bliss-net", version = "0.3.0" }
arniko-crush  = { path = "crates/arniko-crush", version = "0.1.0" }

# Servo / Stylo
style         = { version = "0.11.0", package = "stylo" }
style_traits  = { version = "0.11.0", package = "stylo_traits" }
style_atoms   = { version = "0.11.0", package = "stylo_atoms" }
style_config  = { version = "0.11.0", package = "stylo_config" }
style_dom     = { version = "0.11.0", package = "stylo_dom" }
selectors     = { version = "0.35.0" }
cssparser     = { version = "0.36" }
markup5ever   = "0.37.0"
html5ever     = "0.37.0"
xml5ever      = "0.37.0"
euclid        = "0.22"
atomic_refcell = "0.1.13"
app_units     = "0.7.5"
smallvec      = "1"

# DioxusLabs Taffy
taffy = { version = "0.11", default-features = false, features = [
    "std", "flexbox", "grid", "block_layout", "content_size", "calc", "detailed_layout_info",
] }

# Linebender Parley
parley = { version = "0.10", default-features = false, features = ["std"] }

# GPU / rendering
anyrender       = "0.7"
anyrender_svg   = "0.8"
wgpu            = "27"
vello           = { version = "0.7", features = ["wgpu"] }
peniko          = "0.6.0"
kurbo           = "0.13"
skrifa          = { version = "0.40", default-features = false, features = ["std"] }
color           = "0.3.2"
linebender_resource_handle = "0.1"
usvg            = "0.46"

# Windowing & input
winit           = { version = "=0.31.0-beta.2" }
accesskit       = "0.24"
keyboard-types  = "0.7"
cursor-icon     = "1"
arboard         = { version = "3.4.1", default-features = false }
rfd             = { version = "0.17.1", default-features = false }

# Networking
tokio    = { version = "1.42", features = ["rt-multi-thread"] }
reqwest  = { version = "0.12", default-features = false }
url      = "2.5.0"
http     = "1.1.0"
data-url = "0.3.1"
bytes    = "1.7.1"

# Misc
serde          = "1"
serde_json     = "1"
anyhow         = "1.0"
tracing        = "0.1.40"
futures-util   = "0.3.30"
bitflags       = "2.8.0"
slab           = "0.4.9"
image          = { version = "0.25", default-features = false }
wuff           = "0.2"
smol_str       = "0.3"
rayon          = "1"
thread_local   = "1"
fastrand       = "2.3.0"
