[workspace]
resolver = "2"
members = [
    # Bliss DOM engine
    "crates/bliss-traits",
    "crates/bliss-dom",
    "crates/bliss-html",
    "crates/bliss-net",
    "crates/bliss-paint",
    "crates/bliss-shell",
    "crates/bliss",
    # Bliss support crates
    "crates/stylo_taffy",
    "crates/debug_timer",
    "crates/accesskit_xplat",
    # Vello rendering backend (in-repo fork: SceneOverlay/set_scene_effects
    # mustang hooks — see SHELL-SPLIT-0-1). Was previously unwired (consumed
    # from crates.io instead), which left the in-tree copy dead code and
    # `--features "reactive gpu"` examples (blur_panel, phase5_demo) broken
    # against the published crate. Patched below to fix that.
    "crates/anyrender_vello",

    "crates/tornado",
    "crates/tornado-styles",
    "crates/tornado-wrap",
    "crates/tornado-hyperlink",
    "crates/tornado-spinner",
    "crates/tornado-scrollview",
    # Arniko SDK
    "crates/arniko",
    # Networking
    "crates/exo-bliss-net",
    # Arniko Crush capsule bindings
    "crates/arniko-crush",
]

[workspace.package]
version      = "0.2.99"
license      = "MIT OR Apache-2.0"
homepage     = "https://github.com/nixpt/arniko"
repository   = "https://github.com/nixpt/arniko"
categories   = ["gui"]
edition      = "2024"
rust-version = "1.85.0"

# ── patch: redirect crates-io bliss-* + exo-mesh to in-repo / vendored ───────
[patch.crates-io]
arniko-bliss  = { path = "crates/bliss" }
bliss-dom     = { path = "crates/bliss-dom" }
bliss-html    = { path = "crates/bliss-html" }
bliss-net     = { path = "crates/bliss-net" }
bliss-paint   = { path = "crates/bliss-paint" }
bliss-shell   = { path = "crates/bliss-shell" }
bliss-traits  = { path = "crates/bliss-traits" }
bliss-stylo-taffy = { path = "crates/stylo_taffy" }
anyrender_vello = { path = "crates/anyrender_vello" }

# ── workspace.dependencies ────────────────────────────────────────────────────
[workspace.dependencies]
# Arniko stack (in-repo)
bliss         = { path = "crates/bliss",        version = "0.2.99", package = "arniko-bliss" }
bliss-dom     = { path = "crates/bliss-dom",    version = "0.2.99", default-features = false }
bliss-html    = { path = "crates/bliss-html",   version = "0.2.99", default-features = false }
bliss-net     = { path = "crates/bliss-net",    version = "0.2.99", default-features = false }
bliss-paint   = { path = "crates/bliss-paint",  version = "0.2.99", default-features = false }
bliss-shell   = { path = "crates/bliss-shell",  version = "0.2.99", default-features = false }
bliss-traits  = { path = "crates/bliss-traits", version = "0.2.99", default-features = false }
stylo_taffy   = { path = "crates/stylo_taffy",  version = "0.2.99", package = "bliss-stylo-taffy", default-features = false }
debug_timer   = { path = "crates/debug_timer",  version = "0.1.3" }
accesskit_xplat = { path = "crates/accesskit_xplat", version = "0.1", default-features = false }
# s305-extract rationale: mustang is a standalone repo (`projects/mustang/`,
# published `arniko-mustang v0.2.99` to crates.io via s305 commit `25f898c`).
# Consumed from crates.io here — unlike bliss-*, mustang is NOT a workspace
# member and NOT patched in-repo; this is intentional (see foreman-memory
# `arniko-mustang-bliss-surfer-architecture.md`).
#
# Do NOT add `arniko-mustang = { path = "../mustang" }` to `[patch.crates-io]`
# under normal use: a cross-workspace redirect breaks fresh `cargo check -p
# arniko` if `projects/mustang/` isn't cloned alongside arniko. Use a transient
# (uncommitted) `[patch.crates-io]` override only when iterating mustang+arniko
# in lock-step.
mustang       = { version = "0.2.99", package = "arniko-mustang" }
arniko        = { path = "crates/arniko",       version = "0.2.99" }
exo-bliss-net = { path = "crates/exo-bliss-net", version = "0.2.99" }
arniko-crush  = { path = "crates/arniko-crush", version = "0.1.0" }

# Servo / Stylo
style         = { version = "0.11.0", package = "stylo" }
style_traits  = { version = "0.11.0", package = "stylo_traits" }
style_atoms   = { version = "0.11.0", package = "stylo_atoms" }
style_config  = { version = "0.11.0", package = "stylo_config" }
style_dom     = { version = "0.11.0", package = "stylo_dom" }
selectors     = { version = "0.35.0" }
cssparser     = { version = "0.36" }
markup5ever   = "0.37.0"
html5ever     = "0.37.0"
xml5ever      = "0.37.0"
euclid        = "0.22"
atomic_refcell = "0.1.13"
app_units     = "0.7.5"
smallvec      = "1"

# DioxusLabs Taffy
taffy = { version = "0.11", default-features = false, features = [
    "std", "flexbox", "grid", "block_layout", "content_size", "calc", "detailed_layout_info",
] }

# Linebender Parley
parley = { version = "0.10", default-features = false, features = ["std"] }

# GPU / rendering
anyrender       = "0.7"
anyrender_vello = { path = "crates/anyrender_vello", version = "0.7" }
anyrender_svg   = "0.8"
wgpu            = "27"
vello           = { version = "0.7", features = ["wgpu"] }
peniko          = "0.6.0"
kurbo           = "0.13"
skrifa          = { version = "0.40", default-features = false, features = ["std"] }
color           = "0.3.2"
linebender_resource_handle = "0.1"
usvg            = "0.46"

# Windowing & input
winit           = { version = "=0.31.0-beta.2" }
accesskit       = "0.24"
keyboard-types  = "0.7"
cursor-icon     = "1"
arboard         = { version = "3.4.1", default-features = false }
rfd             = { version = "0.17.1", default-features = false }

# Networking
tokio    = { version = "1.42", features = ["rt-multi-thread"] }
reqwest  = { version = "0.12", default-features = false }
url      = "2.5.0"
http     = "1.1.0"
data-url = "0.3.1"
bytes    = "1.7.1"

# Misc
serde          = "1"
serde_json     = "1"
anyhow         = "1.0"
tracing        = "0.1.40"
futures-util   = "0.3.30"
bitflags       = "2.8.0"
slab           = "0.4.9"
image          = { version = "0.25", default-features = false }
# TUI rendering (workspace-wide, used by tornado + tornado-styles).
ratatui        = "0.30"
# ANSI styling crate (used by tornado-styles to bridge into ratatui styles).
anstyle        = "1"
# Word wrapping engine (used by tornado-wrap).
textwrap       = "0.16"
# Sibling crates
tornado          = { path = "crates/tornado",          version = "0.2.99" }
tornado-styles   = { path = "crates/tornado-styles",   version = "0.2.99" }
tornado-wrap     = { path = "crates/tornado-wrap",     version = "0.2.99" }
tornado-hyperlink = { path = "crates/tornado-hyperlink", version = "0.2.99" }
tornado-spinner = { path = "crates/tornado-spinner", version = "0.2.99" }
# Stateful scrolling view widget for ratatui. Vendored from
# `tui-scrollview` v0.6.7 (Josh McKinney, dual MIT/Apache-2.0). The
# upstream source declared deps on `ratatui-core`/`ratatui-widgets`
# (unstable 0.29-era subcrates); all imports were rewritten to point
# at the merged `ratatui` 0.30 in this fork. See crate NOTICE for the
# exact line-by-line diff.
tornado-scrollview = { path = "crates/tornado-scrollview", version = "0.2.99" }
wuff           = "0.2"
smol_str       = "0.3"
rayon          = "1"
thread_local   = "1"
fastrand       = "2.3.0"
