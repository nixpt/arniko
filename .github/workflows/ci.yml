name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token permissions for a lint/build/test job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-lint:
    name: fmt + clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --package arniko --package bliss-dom --check

      # -D warnings is passed to clippy via `--` so it only affects
      # clippy lints, not arbitrary compiler warnings in build/test.
      - name: cargo clippy (arniko, bliss-dom)
        run: |
          cargo clippy -p arniko -p bliss-dom --all-targets -- -D warnings

  build-arniko:
    name: build arniko + mustang
    runs-on: ubuntu-latest
    needs: fmt-and-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build (arniko)
        run: cargo build -p arniko

      - name: cargo build (mustang)
        run: cargo build -p mustang

  test:
    name: test (arniko + bliss-dom + mustang)
    runs-on: ubuntu-latest
    needs: fmt-and-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test (arniko)
        run: cargo test -p arniko --lib

      - name: cargo test (bliss-dom)
        run: cargo test -p bliss-dom --lib

      - name: cargo test (mustang)
        run: cargo test -p mustang --lib

  arniko-crush:
    name: check arniko-crush (requires sibling crush-ast)
    runs-on: ubuntu-latest
    needs: fmt-and-lint

    # arniko-crush depends on crush-lang-sdk from the sibling crush-ast repo.
    # We check out crush-ast at the same directory level as arniko so the
    # relative path dependency in arniko/Cargo.toml resolves.
    # Adjust CRUSH_AST_REF below to track a known-good crush-ast commit
    # (e.g. after the stdlib fix lands).
    env:
      CRUSH_AST_REF: a0eabdd

    steps:
      - name: Checkout arniko
        uses: actions/checkout@v4
        with:
          path: arniko

      - name: Checkout crush-ast (pinned to known-good ref)
        uses: actions/checkout@v4
        with:
          repository: nixpt/crush-ast
          ref: ${{ env.CRUSH_AST_REF }}
          path: crush-ast

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check (arniko-crush)
        working-directory: arniko
        run: cargo check -p arniko-crush

      - name: cargo fmt --check (arniko-crush)
        working-directory: arniko
        run: cargo fmt --package arniko-crush --check
