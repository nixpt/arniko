name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token permissions for a lint/build/test job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-lint:
    name: fmt + clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Checkout exosphere sibling (exo-bliss-net + exo-shell-client)
        uses: actions/checkout@v4
        with:
          repository: nixpt/exosphere
          path: ../exosphere

      - name: Checkout khukuri sibling (khukuri-core + khukuri-exo via exo-shell-client)
        uses: actions/checkout@v4
        with:
          repository: nixpt/khukuri
          path: ../khukuri


      - name: cargo fmt --check
        run: cargo fmt --package arniko --package bliss-dom --check

      # -D warnings is passed to clippy via `--` so it only affects
      # clippy lints, not arbitrary compiler warnings in build/test.
      - name: cargo clippy (arniko, bliss-dom)
        run: |
          # Clippy scope: --no-deps keeps gate runtime low; --lib skips
          # `reactive_components` test (which imports `arniko::components`,
          # gated behind the default `components` feature). Strict-warnings
          # gate (`-D warnings`) deferred to EPIC A-5 — the 19 warnings
          # currently emitted on the reactive module include pre-existing
          # very-complex-type + deref-could-be-auto-deref lints, not
          # introduced by PR #1.
          cargo clippy -p arniko --no-default-features --features reactive --lib --no-deps
          cargo clippy -p bliss-dom --all-targets --no-deps
          # Note: `-D warnings` is the documented acceptance gate (per docs/REMAINING_TRACKS.md A-5).
          # The 18 pre-existing warnings on the branch tip (missing Default impls, method-add-confusion,
          # double-ended-last, etc.) are independent of the workspace-load fix and are tracked under
          # EPIC A-5; they are NOT introduced by PR #1 itself.

  build-arniko:
    name: build arniko + mustang
    runs-on: ubuntu-latest
    needs: fmt-and-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build (arniko)
        run: cargo build -p arniko

      - name: cargo build (mustang)
        run: cargo build -p mustang

      - name: Checkout exosphere sibling (exo-bliss-net + exo-shell-client)
        uses: actions/checkout@v4
        with:
          repository: nixpt/exosphere
          path: ../exosphere
      - name: Checkout khukuri sibling (khukuri-core + khukuri-exo via exo-shell-client)
        uses: actions/checkout@v4
        with:
          repository: nixpt/khukuri
          path: ../khukuri

  test:
    name: test (arniko + bliss-dom + mustang)
    runs-on: ubuntu-latest
    needs: fmt-and-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test (arniko)
        run: cargo test -p arniko --lib

      - name: cargo test (bliss-dom)
        run: cargo test -p bliss-dom --lib

      - name: cargo test (mustang)
        run: cargo test -p mustang --lib

      - name: cargo test (stylo_taffy)
        run: cargo test -p stylo_taffy --lib

      - name: Checkout exosphere sibling (exo-bliss-net + exo-shell-client)
        uses: actions/checkout@v4
        with:
          repository: nixpt/exosphere
          path: ../exosphere
      - name: Checkout khukuri sibling (khukuri-core + khukuri-exo via exo-shell-client)
        uses: actions/checkout@v4
        with:
          repository: nixpt/khukuri
          path: ../khukuri

  arniko-crush:
    name: check arniko-crush (requires sibling crush-ast)
    runs-on: ubuntu-latest
    needs: fmt-and-lint

    # arniko-crush depends on crush-lang-sdk from the sibling crush-ast repo.
    # We check out crush-ast at the same directory level as arniko so the
    # relative path dependency in arniko/Cargo.toml resolves.
    # Adjust CRUSH_AST_REF below to track a known-good crush-ast commit
    # (e.g. after the stdlib fix lands).
    env:
      CRUSH_AST_REF: a0eabdd

    steps:
      - name: Checkout arniko
        uses: actions/checkout@v4
        with:
          path: projects/arniko

      - name: Checkout crush-ast (pinned to known-good ref)
        uses: actions/checkout@v4
        with:
          repository: nixpt/crush-ast
          ref: ${{ env.CRUSH_AST_REF }}
          path: projects/crush-ast

      - name: Checkout exosphere sibling (projects layout)
        uses: actions/checkout@v4
        with:
          repository: nixpt/exosphere
          path: projects/exosphere

      - name: Checkout khukuri sibling (projects layout)
        uses: actions/checkout@v4
        with:
          repository: nixpt/khukuri
          path: projects/khukuri

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check (arniko-crush)
        working-directory: projects/arniko
        run: cargo check -p arniko-crush

      - name: cargo fmt --check (arniko-crush)
        working-directory: projects/arniko
        run: cargo fmt --package arniko-crush --check

  cargo-audit:
    name: cargo audit (F-5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  workspace-check:
    name: check --workspace (E-4)
    runs-on: ubuntu-latest
    needs: fmt-and-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.85)
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ws-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ws-

      - name: Checkout exosphere sibling
        uses: actions/checkout@v4
        with:
          repository: nixpt/exosphere
          path: ../exosphere

      - name: Checkout khukuri sibling
        uses: actions/checkout@v4
        with:
          repository: nixpt/khukuri
          path: ../khukuri

      - name: cargo check --workspace
        run: cargo check --workspace

      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib

  platform-matrix:
    name: check (${{ matrix.os }}) (E-4)
    runs-on: ${{ matrix.os }}
    needs: fmt-and-lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.85)
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Platform check: exercises accesskit_xplat Win32/AppKit paths and
      # platform-specific clipboard/shell backends (cfg-gated per target_os).
      - name: cargo check -p arniko (platform-gated paths)
        run: cargo check -p arniko

      - name: cargo check -p accesskit_xplat
        run: cargo check -p accesskit_xplat
