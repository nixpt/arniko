name: CI

# arniko is the SDK layer only (arniko, arniko-crush, exo-bliss-net). Its
# rendering stack comes from crates.io — bliss-* (nixpt/bliss-engine) and
# arniko-mustang (nixpt/mustang) — so no sibling repos are checked out.
# (The previous workflow checked out ../exosphere and ../khukuri, which
# actions/checkout refuses, and built crates that no longer live here.)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token permissions for a lint/build/test job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.89)
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # bliss-html (a dev-dependency) pulls parley -> fontique ->
      # yeslogic-fontconfig-sys, whose build script needs fontconfig.pc.
      - name: Install apt deps
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libfontconfig1-dev
          version: 1.0

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # Warnings are reported but not fatal (-D warnings is deferred to
      # EPIC A-5: pre-existing complex-type / missing-Default lints).
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --no-deps --exclude arniko-crush

  check-and-test:
    name: check + test (MSRV 1.89)
    runs-on: ubuntu-latest
    needs: fmt-and-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.89)
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Install apt deps
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libfontconfig1-dev
          version: 1.0

      # arniko-crush is excluded here: crush-lang-sdk 0.3.9 pulls crush-cson and
      # crush-index, which need rustc 1.95. It has its own job below.
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets --exclude arniko-crush

      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib --exclude arniko-crush

  arniko-crush:
    name: arniko-crush (rust 1.95)
    runs-on: ubuntu-latest
    needs: fmt-and-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # crush-lang-sdk 0.3.9's dependency tree (crush-cson, crush-index)
      # declares rust-version 1.95, so this crate can't build on the 1.89 MSRV.
      - name: Install Rust toolchain (1.95)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install apt deps
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libfontconfig1-dev
          version: 1.0

      - name: cargo clippy -p arniko-crush
        run: cargo clippy -p arniko-crush --all-targets --no-deps --locked

      - name: cargo test -p arniko-crush
        run: cargo test -p arniko-crush --locked

  cargo-audit:
    name: cargo audit (F-5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  # macOS/Windows runners bill several times the Linux rate on a private
  # repo, so the platform check runs only when started by hand
  # (Actions tab → CI → Run workflow), not on every push/PR.
  platform-matrix:
    name: check (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.89)
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: cargo check -p arniko (platform-gated paths)
        run: cargo check -p arniko
