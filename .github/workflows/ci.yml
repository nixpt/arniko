name: CI

# arniko is the SDK layer only (arniko, arniko-crush, exo-bliss-net). Its
# rendering stack comes from crates.io — bliss-* (nixpt/bliss-engine) and
# arniko-mustang (nixpt/mustang) — so no sibling repos are checked out.
# (The previous workflow checked out ../exosphere and ../khukuri, which
# actions/checkout refuses, and built crates that no longer live here.)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token permissions for a lint/build/test job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.89)
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # Warnings are reported but not fatal (-D warnings is deferred to
      # EPIC A-5: pre-existing complex-type / missing-Default lints).
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --no-deps

  check-and-test:
    name: check + test (MSRV 1.89)
    runs-on: ubuntu-latest
    needs: fmt-and-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.89)
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets

      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib

  cargo-audit:
    name: cargo audit (F-5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  # macOS/Windows runners bill several times the Linux rate on a private
  # repo, so the platform check runs only when started by hand
  # (Actions tab → CI → Run workflow), not on every push/PR.
  platform-matrix:
    name: check (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.89)
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: cargo check -p arniko (platform-gated paths)
        run: cargo check -p arniko
