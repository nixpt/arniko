[package]
name = "arniko-crush"
version.workspace = true
authors = ["The Exosphere Authors"]
edition.workspace = true
description = "Arniko UI components as importable host capabilities for CRUSH capsules"
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
arniko = { workspace = true, features = ["html", "components"] }
crush-lang-sdk = { version = "0.2.0", default-features = false }
serde_json = "1"
