[package]
name = "arniko-crush"
version.workspace = true
authors = ["The Exosphere Authors"]
edition.workspace = true
description = "Arniko UI components as importable host capabilities for CRUSH capsules"
license.workspace = true
homepage.workspace = true
repository.workspace = true
# crush-lang-sdk 0.8 (crush-ast) needs rustc 1.95; the rest of the workspace
# keeps the 1.89 MSRV.
rust-version = "1.95"
categories.workspace = true
readme = "README.md"

[features]
default = []

[dependencies]
arniko = { workspace = true, features = ["html", "components"] }
crush-lang-sdk = { version = "0.8.0", default-features = false }
serde_json = "1"
# noonoo 0.20 (crates.io): the clean-room engine replacing bliss-engine.
noonoo-caps = "0.20"
noonoo-css = "0.20"
noonoo-dom = "0.20"
noonoo-html = "0.20"
noonoo-query = "0.20"
noonoo-style = "0.20"

[dev-dependencies]
# Layout + paint golden test only.
noonoo-geometry = "0.20"
noonoo-layout = "0.20"
noonoo-paint = "0.20"
