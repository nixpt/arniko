[package]
name = "arniko-crush"
version = "0.1.0"
authors = ["The Exosphere Authors"]
edition = "2024"
description = "Arniko UI components as importable host capabilities for CRUSH capsules"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nixpt/arniko"

[features]
default = []

[dependencies]
arniko = { workspace = true, features = ["html", "components"] }
crush-lang-sdk = { path = "../../../crush-ast/crates/crush-lang-sdk", default-features = false }
serde_json = "1"
