[package]
name = "tui-shell"
version = "0.1.0"
edition = "2024"
description = "Shared terminal UI shell helpers for Exosphere TUI applications"
authors = ["Exosphere Team"]
license = "MIT OR Apache-2.0"

[features]
default = []
# Enable ExoShell integration (optional registration with the Exosphere root shell)
exoshell = ["dep:exo-shell-client", "dep:tokio"]

[dependencies]
crossterm = "0.27"
ratatui = "0.26"
tracing = "0.1"

# ExoShell integration (optional)
exo-shell-client = { path = "../../../exosphere/crates/exo/shell-client", optional = true }
tokio = { version = "1.0", features = ["net", "io-util", "rt"], optional = true }
