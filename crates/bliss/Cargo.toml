[package]
name = "arniko-bliss"
version.workspace = true
description = "High-level APIs for rendering HTML with Bliss"
documentation = "https://docs.rs/bliss"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true

[lib]
name = "bliss"

[features]
default = ["net"]
net = ["dep:tokio", "dep:url", "dep:bliss-net"]
tracing = ["bliss-shell/tracing"]

[dependencies]
# Bliss dependencies
anyrender_vello = "0.7"
bliss-traits = { path = "../bliss-traits", version = "0.2.99" }
bliss-dom = { path = "../bliss-dom", version = "0.2.99" }
bliss-html = { path = "../bliss-html", version = "0.2.99" }
bliss-shell = { path = "../bliss-shell", version = "0.2.99" }
bliss-paint = { path = "../bliss-paint", version = "0.2.99" }
bliss-net = { path = "../bliss-net", version = "0.2.99", optional = true }

# IO & Networking
url = { version = "2.5.0", features = ["serde"], optional = true }
tokio = { version = "1.42", features = ["rt-multi-thread"], optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
