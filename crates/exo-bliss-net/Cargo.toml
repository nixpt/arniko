[package]
name = "exo-bliss-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Exosphere-native NetProvider for Bliss - routes capsule://, data://, file://, http(s):// schemes"
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["http-fallback"]
# capsule:// routing: placeholder, currently a no-op (its exo-mesh backend was removed from arniko in s506)
capsule = []
# http/https fallback via reqwest
http-fallback = ["dep:reqwest"]
# exo:// and mycelium:// features are not included here — they still depend on
# xip/mycelium from the exosphere tree. Re-add when those are extracted or published.

[dependencies]
bliss-traits = { workspace = true }
tokio = { version = "1.0", features = ["rt", "sync", "time"] }
tracing = "0.1"
url = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt", "macros"] }

# exo-mesh removed for crates.io publish (not on registry; capsule feature is a no-op stub when installed from registry)

# http-fallback feature
[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls"]
optional = true
