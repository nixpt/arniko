[package]
name = "tornado-sparkline"
version = "0.2.99"
edition = "2021"
rust-version = "1.85.0"
description = "Vendored copy of ratatui::widgets::Sparkline + SparklineBar (v0.30), MIT/Apache-2.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nixpt/arniko"
publish = false

# ─── Vendoring note ────────────────────────────────────────────────────────
# This crate exists to mirror `ratatui::widgets::Sparkline` and
# `SparklineBar` from upstream `ratatui-v0.30.0/src/widgets/sparkline.rs`
# into the umbrella's `sparkline` feature. The widget is fully
# **stateless** — only the `Widget` impl is vendored (no
# `StatefulWidget` counterpart exists upstream, so no
# `SparklineState` is needed).

[lib]
name = "tornado_sparkline"
path = "src/lib.rs"

[dependencies]
# The vendored widget depends only on the public ratatui surface —
# buffer, layout, style, text, widgets. No internal `ratatui::*`
# private items. (Round 10 vendoring note: in upstream 0.29 the
# `Sparkline` widget lived in the unstable `ratatui-widgets`
# subcrate; in 0.30 the subcrates were merged back into the single
# `ratatui` crate, so no path rewrite is needed for 0.30.)
ratatui = { workspace = true }

[dev-dependencies]
# No additional test deps — the integration tests live in
# `tests/sparkline_integration.rs` and exercise the public surface.

[[test]]
name = "sparkline_integration"
path = "tests/sparkline_integration.rs"
