[package]
name = "bliss-paint"
version = "0.2.99"
description = "Paint a Bliss Document using anyrender"
documentation = "https://docs.rs/bliss-paint"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.85.0"

[features]
default = ["svg"]
tracing = ["dep:tracing"]
svg = ["dep:anyrender_svg", "dep:usvg", "bliss-dom/svg"]

[dependencies]
# Bliss dependencies
anyrender = "0.7"
anyrender_svg = { version = "0.8", optional = true }
bliss-traits = { path = "../bliss-traits" }
bliss-dom = { path = "../bliss-dom" }

# Servo dependencies
style = { version = "0.11.0", package = "stylo" }
euclid = "0.22"

# DioxusLabs dependencies
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "25759dad44d8350743a4e866fee54962f996895a", default-features = false, features = [
  "std",
  "flexbox",
  "grid",
  "block_layout",
  "content_size",
  "calc",
  "detailed_layout_info",
] }

# Linebender + WGPU dependencies
parley = { git = "https://github.com/linebender/parley", rev = "4f1bedf08c9d98a646975806adccc6ca41a08841", default-features = false, features = ["std"] }
color = "0.3.2"
peniko = "0.6.0"
kurbo = "0.13"
usvg = { version = "0.46", optional = true }

# Other dependencies
tracing = { version = "0.1.40", optional = true }
