[package]
name = "arniko"
version = "0.1.0"
authors = ["The Exosphere Authors"]
edition = "2024"
description = "Arniko: Unified UI framework for Exosphere capsules"
license = "MIT OR Apache-2.0"

[features]
default = ["html", "components"]
html = []                    # HTML string generation
components = ["html"]        # UI components
gpu = ["mustang/gpu"]        # GPU acceleration via Mustang
# A-4 + A-4b cfg-gate: `networking` enables `exo-mesh/p2p` only (Stage 1).
# `exo-bliss-net` was declared here but never imported in arniko src — dropped
# in A-4c to eliminate the upstream exo-mesh 0.1.0 (pulled by exo-bliss-net)
# from the graph. That upstream copy had an unconditional `use libp2p::Multiaddr`
# in node.rs, which failed (E0432) when compiled with only the `local` feature
# (as exo-bliss-net requests). Removing exo-bliss-net collapses the graph to a
# single exo-mesh entry (the vendored 0.2.99-a4b). Re-add exo-bliss-net only
# when arniko genuinely imports from it.
networking = ["exo-mesh/p2p"]    # Exosphere networking (vendored exo-mesh only)
# A-4b cfg-gate: opt-in to libp2p's `quic` + `relay` features via the
# vendored exo-mesh sub-features. DEFAULT OFF. Activating either (or both)
# re-introduces rcgen 0.13.2's blanket-impl E0119 conflict with newer `time`
# transitively (via libp2p-tls/x509-parser). Required only for QUIC transport
# + relay-driven NAT traversal; the TCP/gossipsub/kad stack works fine
# WITHOUT these.
quic = ["exo-mesh/quic"]
relay = ["exo-mesh/relay"]
launch = ["bliss"]           # Native window launch via bliss
reactive = ["bliss", "bliss-dom", "anyrender_vello", "winit", "keyboard-types", "mustang"]  # Reactive Signal + View + EventSink + launch (mustang: SceneScheduler hook)
full = ["html", "components", "gpu", "networking", "launch", "reactive"]

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
url = "2"
parking_lot = "0.12"

# Mustang GPU compositor (optional)
[dependencies.mustang]
path = "../mustang"
optional = true

# Component dependencies (minimal for HTML-only mode)
# Components are defined in src/components/

# GPU dependencies (optional) - now provided by mustang
# [dependencies.anyrender]
# version = "0.7"
# optional = true
#
# [dependencies.anyrender_vello]
# version = "0.7"
# optional = true
#
# [dependencies.wgpu]
# version = "26.0"
# optional = true
#
# [dependencies.kurbo]
# version = "0.13"
# optional = true
#
# [dependencies.peniko]
# version = "0.6"
# optional = true

# Native window launch (optional)
[dependencies.bliss]
path = "../bliss"
optional = true

# Reactive layer — DOM mutation API (optional)
[dependencies.bliss-dom]
path = "../bliss-dom"
optional = true

[dependencies.anyrender_vello]
path = "../anyrender_vello"
optional = true

[dependencies.winit]
version = "=0.31.0-beta.2"
optional = true

# Networking dependencies (optional)
[dependencies.exo-bliss-net]
path = "../../../exosphere/crates/platform/sdk/exo-bliss-net"
optional = true

# A-4b cfg-gate: exo-mesh is vendored under `crates/_vendored/exo-mesh/`
# instead of reaching into the exosphere working tree. The vendored copy
# exposes `quic` + `relay` as default-off sub-features so arniko's
# `networking` feature compiles against a libp2p tree WITHOUT the `quic`
# path (which transitively pulls rcgen 0.13.2 -> E0119 blanket-impl conflict
# with newer `time`). arniko mirrors these as `quic` + `relay` opt-in
# features (above); default builds skip both for the A-4b acceptance gate.
# See `crates/_vendored/exo-mesh/Cargo.toml` for the libp2p feature trim +
# the sub-feature declarations, and `.dejavue/decisions.md` A-4b for the
# diagnostic trail.
[dependencies.exo-mesh]
path = "../_vendored/exo-mesh"
optional = true

[dependencies.keyboard-types]
version = "0.7"
optional = true

[dev-dependencies]
tokio-test = "0.4"
vello = { workspace = true }
bliss-html = { path = "../bliss-html" }

[[test]]
name = "reactive_components"
required-features = ["reactive"]

# `tests/reactive_signals.rs` imports `arniko::reactive`, `arniko::mustang`, and
# `bliss_dom` — all gated behind the `reactive` feature / workspace path. Without
# `required-features = ["reactive"]`, `cargo clippy --all-targets` compiles this
# test binary without the reactive feature and E0432/E0433-fails at the imports.
# PR-#1-CI fix: gate it parallel to `reactive_components`.
[[test]]
name = "reactive_signals"
required-features = ["reactive"]

# Examples gated to the features they need so `cargo check -p arniko` (default
# features only) stays green. Run with --features to build a specific example.
[[example]]
name = "blur_panel"
required-features = ["reactive", "gpu"]

[[example]]
name = "computed_counter"
required-features = ["reactive"]

[[example]]
name = "reactive_counter"
required-features = ["reactive"]

[[example]]
name = "todo_list"
required-features = ["reactive"]

[[example]]
name = "launch"
required-features = ["launch"]

[[example]]
name = "advanced"
required-features = ["gpu"]  

[[example]]
name = "phase5_demo"
required-features = ["reactive", "gpu"]  

[[example]]
name = "dogfood_m4"
required-features = ["reactive"]

# `tests/dogfood_m4.rs` exercises the full reactive surface to validate the
# dogfood demo end-to-end (Signal → Computed → For → Switch → ComponentView via
# Show/Switch mounting, plus the D-2c-followup empty-doc hit/paint/scroll/clear
# backstop on a stripped DOM). Compile-gated on `reactive` so cargo check
# / clippy --all-targets under default features stays green.
[[test]]
name = "dogfood_m4"
required-features = ["reactive"]
