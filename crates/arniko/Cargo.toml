[package]
name = "arniko"
version = "0.1.0"
authors = ["The Exosphere Authors"]
edition = "2024"
description = "Arniko: Unified UI framework for Exosphere capsules"
license = "MIT OR Apache-2.0"

[features]
default = ["html", "components"]
html = []                    # HTML string generation
components = ["html"]        # UI components
gpu = ["mustang/gpu"]        # GPU acceleration via Mustang
networking = ["exo-bliss-net", "exo-mesh/p2p"]    # Exosphere networking (forces libp2p on via feature unification — see A-4)
launch = ["bliss"]           # Native window launch via bliss
reactive = ["bliss", "bliss-dom", "anyrender_vello", "winit", "keyboard-types", "mustang"]  # Reactive Signal + View + EventSink + launch (mustang: SceneScheduler hook)
full = ["html", "components", "gpu", "networking", "launch", "reactive"]

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
url = "2"
parking_lot = "0.12"

# Mustang GPU compositor (optional)
[dependencies.mustang]
path = "../mustang"
optional = true

# Component dependencies (minimal for HTML-only mode)
# Components are defined in src/components/

# GPU dependencies (optional) - now provided by mustang
# [dependencies.anyrender]
# version = "0.7"
# optional = true
#
# [dependencies.anyrender_vello]
# version = "0.7"
# optional = true
#
# [dependencies.wgpu]
# version = "26.0"
# optional = true
#
# [dependencies.kurbo]
# version = "0.13"
# optional = true
#
# [dependencies.peniko]
# version = "0.6"
# optional = true

# Native window launch (optional)
[dependencies.bliss]
path = "../bliss"
optional = true

# Reactive layer — DOM mutation API (optional)
[dependencies.bliss-dom]
path = "../bliss-dom"
optional = true

[dependencies.anyrender_vello]
path = "../anyrender_vello"
optional = true

[dependencies.winit]
version = "=0.31.0-beta.2"
optional = true

# Networking dependencies (optional)
[dependencies.exo-bliss-net]
path = "../../../exosphere/crates/platform/sdk/exo-bliss-net"
optional = true

# EPIC A-4 / D-4: exo-bliss-net pulls exo-mesh with only the `local` feature,
# but exo-mesh/src/node.rs has unconditional `use libp2p::Multiaddr;` and an
# unconditional `MeshNode::peer_id` that calls `NodeIdentity::peer_id()` only
# defined under `cfg(feature = "p2p")`. Without forcing `p2p` here, the build
# fails when `networking`/`full` is on. Listing exo-mesh as a direct optional
# dep and enabling `p2p` via the `exo-mesh/p2p` feature syntax below triggers
# Cargo feature unification so `libp2p` is materialized across the graph.
[dependencies.exo-mesh]
path = "../../../exosphere/crates/exo/net/mesh"
optional = true

[dependencies.keyboard-types]
version = "0.7"
optional = true

[dev-dependencies]
tokio-test = "0.4"
vello = { workspace = true }
bliss-html = { path = "../bliss-html" }

[[test]]
name = "reactive_components"
required-features = ["reactive"]

# `tests/reactive_signals.rs` imports `arniko::reactive`, `arniko::mustang`, and
# `bliss_dom` — all gated behind the `reactive` feature / workspace path. Without
# `required-features = ["reactive"]`, `cargo clippy --all-targets` compiles this
# test binary without the reactive feature and E0432/E0433-fails at the imports.
# PR-#1-CI fix: gate it parallel to `reactive_components`.
[[test]]
name = "reactive_signals"
required-features = ["reactive"]

# Examples gated to the features they need so `cargo check -p arniko` (default
# features only) stays green. Run with --features to build a specific example.
[[example]]
name = "blur_panel"
required-features = ["reactive", "gpu"]

[[example]]
name = "computed_counter"
required-features = ["reactive"]

[[example]]
name = "reactive_counter"
required-features = ["reactive"]

[[example]]
name = "todo_list"
required-features = ["reactive"]

[[example]]
name = "launch"
required-features = ["launch"]

[[example]]
name = "advanced"
required-features = ["gpu"]  

[[example]]
name = "phase5_demo"
required-features = ["reactive", "gpu"]  

[[example]]
name = "dogfood_m4"
required-features = ["reactive"]

# `tests/dogfood_m4.rs` exercises the full reactive surface to validate the
# dogfood demo end-to-end (Signal → Computed → For → Switch → ComponentView via
# Show/Switch mounting, plus the D-2c-followup empty-doc hit/paint/scroll/clear
# backstop on a stripped DOM). Compile-gated on `reactive` so cargo check
# / clippy --all-targets under default features stays green.
[[test]]
name = "dogfood_m4"
required-features = ["reactive"]
