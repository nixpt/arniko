[package]
name = "tornado-list"
version = "0.2.99"
edition = "2021"
rust-version = "1.85.0"
description = "Vendored ratatui::widgets::List + StatefulWidget (round-11 canonical StatefulWidget precedent), MIT/Apache-2.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nixpt/arniko"
publish = false

# Vendoring note (D7 round-11 design memo): this crate mirrors
# `List` + `StatefulWidget for List` + `ListState` from upstream
# `ratatui-v0.30.0/src/widgets/list.rs` into the umbrella's
# `list` feature. Round-11 is the canonical StatefulWidget
# vendoring precedent — BOTH trait impls vendored (no carve-out
# like round-6 Tabs). See the module-level `//!` doc-comment in
# `src/lib.rs` for the E0034 carve-out pattern documentation.

[lib]
name = "tornado_list"
path = "src/lib.rs"

[dependencies]
ratatui = { workspace = true }
unicode-width = { workspace = true }

[[test]]
name = "list_integration"
path = "tests/list_integration.rs"
