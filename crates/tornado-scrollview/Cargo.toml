[package]
name = "tornado-scrollview"
version.workspace = true
# License matches upstream choice (dual MIT OR Apache-2.0) AND the arniko
# workspace default — no override needed.
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stateful scrolling view widget for ratatui — vendored from tui-scrollview v0.6.7 (Josh McKinney, MIT OR Apache-2.0)"
categories = ["command-line-utilities", "command-line-interface"]

[dependencies]
# Upstream v0.6.7 declares `ratatui-core` and `ratatui-widgets` (the unstable
# 0.29-era subcrate split that was reverted in ratatui 0.30). All those
# imports were rewritten to point at the unified `ratatui` crate — see
# the file-level NOTICE for the diff line-by-line.
ratatui = { workspace = true }

[dev-dependencies]
# Upstream uses [`rstest`](https://crates.io/crates/rstest) for its test
# suite (#[fixture] + #[rstest] for table-driven cases). Kept here so the
# vendored test surface runs verbatim under `cargo test -p
# tornado-scrollview`.
rstest = "0.18"
