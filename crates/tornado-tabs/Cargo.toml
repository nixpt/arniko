[package]
name = "tornado-tabs"
description = "Vendored Tabs widget from ratatui 0.30 — dual MIT/Apache-2.0 attribution preserved from upstream ratatui/ratatui"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
categories = ["command-line-interface"]
# Vendored source only — no upstream sub-crate split imports. arniko
# pins ratatui 0.30 (workspace-wide), and the vendored widget mirrors
# the public `ratatui::widgets::Tabs` surface verbatim. No reroll
# patches.
publish = false

[dependencies]
# The vendored widget consumes only the public ratatui API — buffer,
# layout, style, text, widgets. No internal `ratatui::*` private
# items. (Round 6 catch-up note: in upstream 0.29-era the `Tabs`
# widget lived in the unstable `ratatui-widgets` subcrate split; in
# 0.30 the subcrates were merged back into the single `ratatui`
# crate, so no path rewrite is required for 0.30.)
ratatui = { workspace = true }
# `unicode-width` for the `.width()` calls on `String` / `Line` used
# in the vendored render math. Same workspace dep available to the
# scrollview vendoring for the same reason.
unicode-width = { workspace = true }

# Round 6 catch-up: integration-test entry per the user's directive
# ("6 inline smoke tests in the new sibling + integration-test entry
# in `crates/tornado-tabs/Cargo.toml`"). The inline tests live inside
# `src/lib.rs`'s `#[cfg(test)] mod tests`; this gateway exercises the
# public Tabs surface from a sibling-crate location to confirm that
# `cargo test --workspace` (and downstream consumers) can reach the
# widget through `tornado_tabs::*` without going through the
# umbrella's `tabs` feature.
[[test]]
name = "tabs_integration"
path = "tests/tabs_integration.rs"
